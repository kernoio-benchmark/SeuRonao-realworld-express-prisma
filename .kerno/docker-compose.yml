services:
  postgres:
    image: "postgres:16-alpine"
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - "POSTGRES_USER=test_user"
      - "POSTGRES_PASSWORD=test_password"
      - "POSTGRES_DB=test_db"
    ports:
      - "5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U test_user -d test_db"
      interval: "3s"
      timeout: "5s"
      retries: "10"
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      - external-url=postgresql://localhost:{{PORT}}/test_db?user=test_user&password=test_password

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile_inline: |
        # Multi-stage Dockerfile for Node.js/TypeScript/Prisma application

        # Stage 1: Build stage
        FROM node:18-alpine AS builder

        # Install build dependencies
        RUN apk add --no-cache openssl

        # Set working directory
        WORKDIR /app

        # Copy package files
        COPY package*.json ./

        # Install all dependencies (including dev dependencies for build)
        RUN npm ci

        # Copy application source
        COPY . .

        # Generate Prisma Client
        RUN npx prisma generate

        # Build TypeScript application
        RUN npm run build

        # Stage 2: Production stage
        FROM node:18-alpine AS production

        # Install runtime dependencies
        RUN apk add --no-cache openssl

        # Set working directory
        WORKDIR /app

        # Copy package files
        COPY package*.json ./

        # Install only production dependencies
        RUN npm ci --only=production && \
            npm cache clean --force

        # Copy Prisma schema for runtime
        COPY prisma ./prisma

        # Generate Prisma Client in production
        RUN npx prisma generate

        # Copy built application from builder stage
        COPY --from=builder /app/dist ./dist

        # Copy .env file if it exists (optional, can be mounted at runtime)
        COPY .env* ./

        # Create non-root user for security
        RUN addgroup -g 1001 -S nodejs && \
            adduser -S nodejs -u 1001 && \
            chown -R nodejs:nodejs /app

        # Switch to non-root user
        USER nodejs

        # Expose port (default for Express apps)
        EXPOSE 3000

        # Set NODE_ENV to production
        ENV NODE_ENV=production

        # Start the application
        CMD ["sh", "-c", "npx prisma migrate deploy && node dist/server.js"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000"
    labels:
      - jwt-signing-config=HS256:this_is_a_secret_meeting_all_requirements_of_any_hs_algorithms
