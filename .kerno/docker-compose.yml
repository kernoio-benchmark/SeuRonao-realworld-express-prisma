services:
  postgres:
    image: "postgres:16-alpine"
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - "POSTGRES_USER=test_user"
      - "POSTGRES_PASSWORD=test_password"
      - "POSTGRES_DB=test_db"
    ports:
      - "5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U test_user -d test_db"
      interval: "3s"
      timeout: "5s"
      retries: "10"
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      - external-url=postgresql://localhost:{{PORT}}/test_db?user=test_user&password=test_password

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile_inline: |
        # Multi-stage Dockerfile for Node.js/TypeScript/Prisma application

        # Build stage
        FROM node:18-alpine AS builder

        WORKDIR /app

        # Install OpenSSL for Prisma
        RUN apk add --no-cache openssl

        # Copy package files
        COPY package*.json ./

        # Install all dependencies (including dev dependencies for build)
        RUN npm ci

        # Copy prisma schema
        COPY prisma ./prisma/

        # Generate Prisma Client
        RUN npx prisma generate

        # Copy source code and configuration
        COPY tsconfig.json ./
        COPY src ./src

        # Build TypeScript application
        RUN npm run build

        # Production stage
        FROM node:18-alpine AS production

        WORKDIR /app

        # Install OpenSSL for Prisma
        RUN apk add --no-cache openssl

        # Copy package files
        COPY package*.json ./

        # Install only production dependencies
        RUN npm ci --omit=dev && \
            npm cache clean --force

        # Copy Prisma schema and generate client for production
        COPY prisma ./prisma/
        RUN npx prisma generate

        # Copy compiled application from builder
        COPY --from=builder /app/dist ./dist

        # Create .env file placeholder (should be mounted or provided at runtime)
        RUN touch .env

        # Expose port (adjust if needed based on application configuration)
        EXPOSE 3000

        # Run the application
        CMD ["node", "dist/server.js"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000"
    labels:
      - jwt-signing-config=HS256:this_is_a_secret_meeting_all_requirements_of_any_hs_algorithms
