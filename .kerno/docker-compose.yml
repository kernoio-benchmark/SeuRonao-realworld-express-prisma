services:
  postgres:
    image: "postgres:16-alpine"
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - "POSTGRES_USER=test_user"
      - "POSTGRES_PASSWORD=test_password"
      - "POSTGRES_DB=test_db"
    ports:
      - "5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U test_user -d test_db"
      interval: "3s"
      timeout: "5s"
      retries: "10"
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      - external-url=postgresql://localhost:{{PORT}}/test_db?user=test_user&password=test_password

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile_inline: |
        # Multi-stage Dockerfile for Node.js/TypeScript/Prisma application
        
        # Build stage
        FROM node:18 AS builder
        
        WORKDIR /app
        
        # Copy everything
        COPY . ./
        
        # Install dependencies
        RUN npm ci || npm install
        
        # Generate Prisma Client
        RUN npx prisma generate
        
        # Build application directly with tsc (avoid dotenv wrapper)
        RUN npx tsc
        
        # Production stage
        FROM node:18-alpine
        
        # Install OpenSSL for Prisma
        RUN apk add --no-cache openssl
        
        WORKDIR /app
        
        # Set environment to production
        ENV NODE_ENV=production
        
        # Copy package manifests
        COPY package.json package-lock.json* ./
        
        # Copy node_modules from builder
        COPY --from=builder /app/node_modules ./node_modules
        
        # Copy Prisma schema
        COPY prisma ./prisma
        
        # Copy compiled application
        COPY --from=builder /app/dist ./dist
        
        # Create non-root user
        RUN addgroup -g 1001 -S nodejs && \
            adduser -S nodejs -u 1001 && \
            chown -R nodejs:nodejs /app
        
        # Run as non-root user
        USER nodejs
        
        # Expose port
        EXPOSE 3000
        
        # Start application
        CMD ["sh", "-c", "npx prisma db push --accept-data-loss && node dist/server.js"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000"
    labels:
      - jwt-signing-config=HS256:this_is_a_secret_meeting_all_requirements_of_any_hs_algorithms
